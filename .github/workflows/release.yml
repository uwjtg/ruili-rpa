name: Release

# 打 tag 即自动出 NSIS 安装包并发布到 GitHub Releases（免本地带 token）。
# 用法：本地 npm version patch 后 git push origin v0.1.1，本工作流自动跑：
#   装依赖 → 裁 Python sidecar → 构建 → electron-builder 上传 → 翻成正式发布。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sidecar Python deps (uiautomation/comtypes)
        run: python -m pip install --disable-pip-version-check uiautomation comtypes

      - name: Install npm dependencies
        run: npm ci

      - name: Build trimmed Python sidecar
        run: npm run build:sidecar

      - name: Build main + renderer (electron-vite)
        run: npm run build

      - name: Publish NSIS installer to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Mark release as published (un-draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/ci-unpublish-release.mjs
