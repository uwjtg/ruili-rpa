<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111110;
    --bg-subtle: #191918;
    --surface: #1e1e1d;
    --surface-raised: #252524;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --accent: #9D85FF;
    --accent-dim: rgba(124,92,252,0.16);
    --text: #e8e6e3;
    --text-secondary: rgba(232,230,227,0.6);
    --text-tertiary: rgba(232,230,227,0.32);
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.45), 0 4px 12px rgba(0,0,0,0.3);
    --shadow-drag: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1.5px var(--accent);
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --radius-xl: 20px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --note-bg: #221d33;
    --note-border: rgba(124,92,252,0.28);
    --transition-fast: 120ms cubic-bezier(0.25, 0.1, 0.25, 1);
    --transition-normal: 200ms cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 512px 512px;
    mix-blend-mode: overlay;
  }

  .canvas-viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; --grid-color: rgba(255,255,255,0.04); }
  .canvas-viewport.panning { cursor: grabbing; }
  .canvas-world { position: absolute; left: 0; top: 0; width: 20000px; height: 20000px; transform-origin: 0 0; will-change: transform; }

  .canvas-el { position: absolute; cursor: grab; transition: box-shadow var(--transition-normal), transform var(--transition-fast); }
  .canvas-el:hover { z-index: 10; }
  .canvas-el.dragging { cursor: grabbing; z-index: 999; box-shadow: var(--shadow-drag) !important; transform: scale(1.01); transition: none; }

  .section-header { position: absolute; pointer-events: none; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .section-header .section-num { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: var(--accent); opacity: 0.8; }
  .section-header .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--text-tertiary); }
  .section-header .section-line { flex: none; width: 48px; height: 1px; background: linear-gradient(90deg, var(--accent) 0%, transparent 100%); opacity: 0.3; }

  .canvas-title { position: absolute; pointer-events: none; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; color: var(--text); }
  .canvas-text { position: absolute; line-height: 1.7; letter-spacing: 0.005em; color: var(--text-secondary); min-width: 200px; max-width: 620px; white-space: pre-wrap; word-break: break-word; }

  .canvas-tag { display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 500; color: var(--text-secondary); background: var(--surface); border: 1px solid var(--border); white-space: nowrap; }
  .canvas-tag:hover { border-color: var(--border-hover); background: var(--surface-raised); }
  .canvas-tag .tag-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .context-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; min-width: 220px; }
  .context-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .context-card .card-head { padding: 16px 20px 12px; display: flex; align-items: center; gap: 10px; }
  .context-card .card-head .head-indicator { width: 3px; height: 16px; border-radius: 2px; background: var(--accent); flex-shrink: 0; }
  .context-card .card-head h3 { font-size: 13px; font-weight: 600; color: var(--text); }
  .context-card .card-content { padding: 0 20px 20px; font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
  .context-card .card-content ul { list-style: none; }
  .context-card .card-content li { padding: 4px 0 4px 12px; position: relative; }
  .context-card .card-content li::before { content: ''; position: absolute; left: 0; top: 11px; width: 4px; height: 4px; border-radius: 50%; background: var(--text-tertiary); }

  .ds-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .ds-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow-md); }
  .ds-card .ds-head { padding: 16px 20px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-tertiary); }
  .ds-card .ds-body { padding: 0 20px 20px; }

  .swatch-item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .swatch-circle { width: 44px; height: 44px; border-radius: 50%; box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.08); }
  .swatch-name { font-size: 10px; font-weight: 500; color: var(--text-secondary); text-align: center; }
  .swatch-hex { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); text-align: center; }
  .swatch-row { display: flex; flex-wrap: wrap; gap: 14px; }

  .type-sample-row { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }
  .type-sample-meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-tertiary); min-width: 52px; flex-shrink: 0; }
  .type-sample-text { color: var(--text); line-height: 1.3; }

  .canvas-note { background: var(--note-bg); border: 1px solid var(--note-border); border-radius: var(--radius-md); padding: 15px 17px; min-width: 210px; max-width: 320px; box-shadow: var(--shadow-sm); }
  .canvas-note .note-tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; color: var(--accent); opacity: 0.85; margin-bottom: 7px; }
  .canvas-note .note-body { font-size: 12.5px; line-height: 1.65; color: var(--text-secondary); }

  .design-page { background: #fff; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-lg); }
  .design-page .page-content { width: 100%; height: 100%; overflow: hidden; }
  .page-label { position: absolute; bottom: -32px; left: 0; font-size: 11px; font-weight: 500; color: var(--text-tertiary); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .page-label .label-num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); opacity: 0.6; }

  .canvas-diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
  .canvas-diagram .diagram-content { width: 100%; height: 100%; padding: 18px 22px; }

  .zoom-controls { position: fixed; bottom: 24px; right: 24px; display: flex; align-items: center; gap: 1px; z-index: 100; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-md); }
  .zoom-btn { width: 36px; height: 36px; background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .zoom-label { min-width: 50px; height: 36px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .coord-indicator { position: fixed; bottom: 28px; left: 24px; font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); z-index: 100; padding: 4px 10px; background: rgba(17,17,16,0.85); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .kbd-hint { position: fixed; top: 20px; right: 24px; z-index: 100; font-size: 10px; color: var(--text-tertiary); display: flex; gap: 12px; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  .canvas-viewport:hover ~ .kbd-hint { opacity: 1; }
  .kbd-hint kbd { font-family: var(--font-mono); padding: 2px 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 10px; }
</style>
</head>
<body>

<div class="canvas-viewport" id="viewport">
  <div class="canvas-world" id="world"></div>
</div>

<div class="zoom-controls">
  <button class="zoom-btn" id="zoomOut" aria-label="">&#8722;</button>
  <div class="zoom-label" id="zoomLabel">100%</div>
  <button class="zoom-btn" id="zoomIn" aria-label="">+</button>
  <button class="zoom-btn" id="zoomReset" aria-label="">&#8962;</button>
</div>

<div class="coord-indicator" id="coordIndicator">0, 0</div>
<div class="kbd-hint" id="kbdHint"></div>

<script>
(() => {
  const UI_STRINGS = {
    docTitle: '锐流 RPA · 设计交付画布 V2',
    zoom: { zoomIn: '放大', zoomOut: '缩小', reset: '重置视图' },
    kbdHints: [['滚轮', '平移'], ['Ctrl+滚轮', '缩放'], ['Ctrl+Z', '撤销']],
  };
  document.title = UI_STRINGS.docTitle;
  document.getElementById('zoomIn').setAttribute('aria-label', UI_STRINGS.zoom.zoomIn);
  document.getElementById('zoomOut').setAttribute('aria-label', UI_STRINGS.zoom.zoomOut);
  document.getElementById('zoomReset').setAttribute('aria-label', UI_STRINGS.zoom.reset);
  document.getElementById('kbdHint').innerHTML = UI_STRINGS.kbdHints
    .map(function(kv){ return '<span><kbd>' + kv[0] + '</kbd> ' + kv[1] + '</span>'; }).join('');

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const zoomLabel = document.getElementById('zoomLabel');
  const coordIndicator = document.getElementById('coordIndicator');

  let panX = 0, panY = 0, zoom = 1;
  const MIN_ZOOM = 0.05, MAX_ZOOM = 8;

  function updateTransform() {
    world.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    updateGrid();
  }
  function updateGrid() {
    const g = 40 * zoom;
    const ox = panX % g, oy = panY % g;
    viewport.style.backgroundImage = 'radial-gradient(circle, var(--grid-color) 0.8px, transparent 0.8px)';
    viewport.style.backgroundSize = g + 'px ' + g + 'px';
    viewport.style.backgroundPosition = ox + 'px ' + oy + 'px';
  }

  let isPanning = false, panSX, panSY;
  viewport.addEventListener('pointerdown', function(e) {
    if (e.target === viewport || e.target === world) {
      isPanning = true; panSX = e.clientX - panX; panSY = e.clientY - panY;
      viewport.classList.add('panning'); viewport.setPointerCapture(e.pointerId); e.preventDefault();
    }
  });
  viewport.addEventListener('pointermove', function(e) {
    if (!isPanning) return;
    panX = e.clientX - panSX; panY = e.clientY - panSY; updateTransform();
  });
  viewport.addEventListener('pointerup', function() { isPanning = false; viewport.classList.remove('panning'); });

  viewport.addEventListener('wheel', function(e) {
    e.preventDefault();
    const rect = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) {
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      const factor = e.deltaY > 0 ? 0.95 : 1.05;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    } else {
      const hasX = Math.abs(e.deltaX) > 0.5;
      if (hasX || Math.abs(e.deltaX) > Math.abs(e.deltaY) * 0.3) {
        panX -= e.deltaX; panY -= e.deltaY;
      } else {
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
        const factor = e.deltaY > 0 ? 0.95 : 1.05;
        zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
        panX = mx - wx * zoom; panY = my - wy * zoom;
      }
    }
    updateTransform();
  }, { passive: false });

  function zoomAt(factor) {
    const r = viewport.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const wx = (cx - panX) / zoom, wy = (cy - panY) / zoom;
    zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * factor));
    panX = cx - wx * zoom; panY = cy - wy * zoom; updateTransform();
  }
  document.getElementById('zoomIn').onclick = function(){ zoomAt(1.25); };
  document.getElementById('zoomOut').onclick = function(){ zoomAt(0.8); };
  document.getElementById('zoomReset').onclick = function(){ zoom = 1; panX = 0; panY = 0; updateTransform(); };

  viewport.addEventListener('pointermove', function(e) {
    if (isPanning) return;
    const r = viewport.getBoundingClientRect();
    coordIndicator.textContent = Math.round((e.clientX - r.left - panX) / zoom) + ', ' + Math.round((e.clientY - r.top - panY) / zoom);
  });

  let lastPinchDist = null, lastPinchCenter = null;
  viewport.addEventListener('touchstart', function(e) {
    if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      lastPinchDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
      lastPinchCenter = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });
  viewport.addEventListener('touchmove', function(e) {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const t0 = e.touches[0], t1 = e.touches[1];
    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
    const center = { x: (t0.clientX + t1.clientX) / 2, y: (t0.clientY + t1.clientY) / 2 };
    if (lastPinchDist > 0) {
      const r = viewport.getBoundingClientRect();
      const mx = center.x - r.left, my = center.y - r.top;
      const wx = (mx - panX) / zoom, wy = (my - panY) / zoom;
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom * Math.pow(dist / lastPinchDist, 0.6)));
      panX = mx - wx * zoom; panY = my - wy * zoom;
    }
    if (lastPinchCenter) { panX += center.x - lastPinchCenter.x; panY += center.y - lastPinchCenter.y; }
    lastPinchDist = dist; lastPinchCenter = center;
    updateTransform();
  }, { passive: false });
  viewport.addEventListener('touchend', function(e) {
    if (e.touches.length < 2) { lastPinchDist = null; lastPinchCenter = null; }
  });

  const undoStack = [];
  function saveUndo() {
    const s = [];
    world.querySelectorAll('.canvas-el').forEach(function(el){ s.push({ id: el.id, left: el.style.left, top: el.style.top }); });
    undoStack.push({ panX: panX, panY: panY, zoom: zoom, assets: s });
    if (undoStack.length > 60) undoStack.shift();
  }
  function undo() {
    if (!undoStack.length) return;
    const st = undoStack.pop();
    panX = st.panX; panY = st.panY; zoom = st.zoom;
    st.assets.forEach(function(a){ const el = document.getElementById(a.id); if (el) { el.style.left = a.left; el.style.top = a.top; } });
    updateTransform();
  }
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });

  function makeDraggable(el) {
    let dragging = false, sx, sy, ox, oy;
    el.addEventListener('pointerdown', function(e) {
      if (e.button !== 0) return;
      dragging = true; el.classList.add('dragging'); saveUndo();
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
      el.setPointerCapture(e.pointerId); e.stopPropagation();
    });
    el.addEventListener('pointermove', function(e) {
      if (!dragging) return;
      el.style.left = (ox + (e.clientX - sx) / zoom) + 'px';
      el.style.top = (oy + (e.clientY - sy) / zoom) + 'px';
    });
    el.addEventListener('pointerup', function() { if (dragging) { dragging = false; el.classList.remove('dragging'); } });
  }

  let _id = 0;
  function uid(prefix) { return (prefix || 'el') + '-' + (++_id); }

  function addSection(rowY, label) {
    const parts = label.split(' ');
    const num = parts[0] || '';
    const rest = parts.slice(1).join(' ');
    const el = document.createElement('div');
    el.className = 'section-header';
    el.style.left = '60px'; el.style.top = rowY + 'px';
    el.innerHTML = '<span class="section-line"></span><span class="section-num">' + num + '</span><span class="section-label">' + rest + '</span>';
    world.appendChild(el);
    return rowY;
  }
  function addTitle(x, y, text, options) {
    options = options || {};
    const el = document.createElement('div');
    el.className = 'canvas-title'; el.id = uid('title');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 48) + 'px';
    if (options.fontWeight) el.style.fontWeight = options.fontWeight;
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el);
    return el;
  }
  function addText(x, y, text, options) {
    options = options || {};
    const el = document.createElement('div');
    el.className = 'canvas-text canvas-el'; el.id = uid('text');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (options.fontSize || 14) + 'px';
    if (options.color) el.style.color = options.color;
    if (options.maxWidth) el.style.maxWidth = options.maxWidth + 'px';
    el.textContent = text;
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addTag(x, y, label, options) {
    options = options || {};
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('tag');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    const dotColor = options.color || 'var(--accent)';
    el.innerHTML = '<div class="canvas-tag"><span class="tag-dot" style="background:' + dotColor + '"></span>' + label + '</div>';
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addContextCard(x, y, w, h, title, content) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('ctx');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    el.innerHTML = '<div class="context-card" style="width:100%;' + (h ? 'height:100%' : '') + '"><div class="card-head"><div class="head-indicator"></div><h3>' + title + '</h3></div><div class="card-content">' + content + '</div></div>';
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addDesignSystemCard(x, y, w, h, type, data) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('ds');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px';
    if (h) el.style.height = h + 'px';
    const body = (typeof data.html === 'string') ? data.html : '';
    el.innerHTML = '<div class="ds-card" style="width:100%;' + (h ? 'height:100%' : '') + '"><div class="ds-head">' + (data.title || type) + '</div><div class="ds-body">' + body + '</div></div>';
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addPage(x, y, w, h, label, htmlContent) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('page');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.width = w + 'px'; el.style.height = (h + 40) + 'px';
    el.innerHTML = '<div class="design-page" style="width:' + w + 'px;height:' + h + 'px;"><div class="page-content">' + htmlContent + '</div></div><div class="page-label"><span class="label-num">' + label.num + '</span>' + label.text + '</div>';
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addNote(x, y, tag, text) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('note');
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.innerHTML = '<div class="canvas-note"><div class="note-tag">' + tag + '</div><div class="note-body">' + text + '</div></div>';
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function addDiagram(x, y, w, h, htmlContent) {
    const el = document.createElement('div');
    el.className = 'canvas-el'; el.id = uid('diagram');
    el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px';
    el.innerHTML = '<div class="canvas-diagram" style="width:100%;height:100%;"><div class="diagram-content">' + htmlContent + '</div></div>';
    world.appendChild(el); makeDraggable(el);
    return el;
  }
  function below(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.top) + el.offsetHeight + gap; }
  function rightOf(el, gap) { if (gap === undefined) gap = 20; return parseFloat(el.style.left) + el.offsetWidth + gap; }

      + ['首页','应用','编辑器','触发器','机器人','市场'].map(function(t, i) { return '<div style="width:60px;text-align:center"><div style="width:36px;height:36px;margin:0 auto 6px;border-radius:9px;background:#F2F3F5;color:#51565D;display:flex;align-items:center;justify-content:center"><span style="display:block;width:13px;height:13px;border:1.8px solid currentColor;border-radius:4px' + (i===2 ? ';border-color:#7C5CFC' : '') + '"></span></div><div style="font-size:10.5px;color:var(--text-secondary)">' + t + '</div></div>'; }).join('')
      + '</div>'
      + '<div style="margin-top:14px;font-size:11.5px;line-height:1.6;color:var(--text-secondary)">1.7px 描边线性 SVG 图标;导航为顶部横向文字 + 红色下划线,不使用左侧竖栏。</div>' });

    const r3 = maxY([colorCard, typeCard, compCard, iconCard], 90);
    addSection(r3, '03 · 界面设计稿 · 按操作链路排列');
    const pagesY = r3 + 60;
    const PW = 1000, PH = 625;

    addPage(100, pagesY, PW, PH, { num: '01', text: '首页 · 工作台' }, homePage());
    addPage(100 + PW + 70, pagesY, PW, PH, { num: '02', text: '我的应用' }, appsPage());
    addPage(100 + (PW + 70) * 2, pagesY, 1280, 800, { num: '03', text: '流程编辑器(核心)' }, editorPage());
    addPage(100 + (PW + 70) * 2 + 1280 + 70, pagesY, PW, PH, { num: '04', text: '触发器 · 计划任务' }, tasksPage());
    addPage(100 + (PW + 70) * 2 + 1280 + 70 + PW + 70, pagesY, PW, PH, { num: '05', text: '机器人' }, robotsPage());
    addPage(100 + (PW + 70) * 2 + 1280 + 70 + (PW + 70) * 2, pagesY, PW, PH, { num: '06', text: '市场' }, marketPage());

    const jumpsY = pagesY + 800 + 46;
    addText(100 + PW + 22, jumpsY, '导航「应用」查看全部', { fontSize: 12, color: 'var(--text-tertiary)' });
    addText(100 + (PW + 70) + PW + 22, jumpsY, '点击应用卡「编辑」进入编辑器', { fontSize: 12, color: 'var(--text-tertiary)' });
    addText(100 + (PW + 70) * 2 + 1280 + 22, jumpsY, '保存后到「触发器」建计划', { fontSize: 12, color: 'var(--text-tertiary)' });
    addText(100 + (PW + 70) * 2 + 1280 + 70 + PW + 22, jumpsY, '任务由在线机器人执行', { fontSize: 12, color: 'var(--text-tertiary)' });
    addText(100 + (PW + 70) * 2 + 1280 + 70 + (PW + 70) + PW + 22, jumpsY, '市场模板一键安装', { fontSize: 12, color: 'var(--text-tertiary)' });

    addNote(100, jumpsY + 60, '页面链路', '01 → 02 → 03 为主链路;03 运行调试完成后 → 04 挂计划 / 05 看机器人执行;06 安装模板后回到 02。');
    addNote(rightOf(addNote(460, jumpsY + 60, 'V2 差异', '相对 V1:顶部横向导航替代左侧竖栏;品牌红替代蓝;编辑器紫色步骤区 + 两行式步骤行 + 结束标记;新增 AI 助手面板与橙色公告条。'), 20), jumpsY + 60, '还原范围', '指令库点击/拖拽、参数即时生效、运行逐点亮 + 日志流、断点继续、红色开关、邀请胶囊均已实现。');
  }

  initScene();

  const r = viewport.getBoundingClientRect();
  panX = r.width * 0.035;
  panY = r.height * 0.04;
  updateTransform();
})();
</script>
